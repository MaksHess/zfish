  - label_image: "cells"
    parent_label_images:
      -  "embryo"

  - label_image: "nucleus"
    parent_label_images:
      -  "embryo"
      -  "cells"

  label:
  - labelss:
    - "nucleus"

  - labelss:
    - "cells"
    - "embryo"
    props:
    - "!FeretDiameter"
    

  intensity:
  - labelss:
    - "nucleus"
    - "cells"
    # - "embryo"
    channels:
    - '*'
  
  correlation:
  - labelss:
    - 'nucleus'
    channel_pairs:
    - channel_0: "DAPI.1"
      channel_1: "*"
    # - channel_0: "DAPI.1"
    #   channel_1: "DAPI.2"
    # - channel_0: "DAPI.1"
    #   channel_1: "DAPI.3"
    props:
    - "PearsonR"
    - "SpearmanR"
    - "KendallTau"
    

  # density:
  # - labelss:
  #   - "nucleiRaw3"
  #   delaunay_mask_labels:
  #   - "embryoRaw"

  # - labelss:
  #   - "cells"
