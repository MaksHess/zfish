  #   - "embryoRaw"
  #   params:
  #     radius: []
  #     distance_to_closest_neighbor: False
  #     knn_distance: []


  distance:
  - labelss:
    - "nucleus"
    label_objects_to:
    - label_image: "embryo"
      label: 1
    distance_transforms:
    - "DistanceToBorder"
    - "DistanceAlongZ"
    props:
    - "Centroid"
    - "Minimum"
    - "Maximum"



