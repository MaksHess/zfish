root: "/data/active/marvwy/20220721_ZE4i2_aligned"
# root: "M:\\marvwy\\20220721_ZE4i2_aligned"

image_dir: "imgs"

output_dir: "features_v2"

level: 1

features:
  hierarchy:
  - label_image: "cells"
    parent_label_images:
      -  "embryoRaw"

  - label_image: "nucleiRaw3"
    parent_label_images:
      -  "embryoRaw"
      -  "cells"

  label:
  - labelss:
    - "nucleiRaw3"

  - labelss:
    - "cells"
    - "embryoRaw"
    props:
    - "!FeretDiameter"

  intensity:
  - labelss:
    - "nucleiRaw3"
    channels:
    - '*'
  
  correlation:
  - labelss:
    - 'nucleiRaw3'
    channel_pairs:
    - channel_0: "DAPI.1"
      channel_1: "DAPI.0"
    - channel_0: "DAPI.1"
      channel_1: "DAPI.2"
    - channel_0: "DAPI.1"
      channel_1: "DAPI.3"
    props:
    - "PearsonR"
    - "SpearmanR"
    - "KendallTau"
    

  density:
  - labelss:
    - "nucleiRaw3"
    delaunay_mask_labels:
    - "embryoRaw"

  - labelss:
    - "cells"
    delaunay_mask_labels:
    - "embryoRaw"
    params:
      radius: []
      distance_to_closest_neighbor: False
      knn_distance: []


  distance:
  - labelss:
    - "nucleiRaw3"
    label_objects_to:
    - label_image: "embryoRaw"
      label: 1
    distance_transforms:
    - "DistanceToBorder"
    - "DistanceAlongZ"
    props:
    - "Centroid"
    - "Minimum"
    - "Maximum"


intensity_correction:
  z_decay_add_model_name_to_feature_path: true
  t_decay_models: "/data/active/marvwy/20220721_ZE4i2_aligned/models/t_decay"
  z_decay_models: "/data/active/marvwy/20220721_ZE4i2_aligned/models/z_decay/ExpFitLinear(loss='huber', features=['MediumPath', 'EmbryoPath'])"
  # t_decay_models: "M:\\marvwy\\20220721_ZE4i2_aligned\\models\\t_decay"
  # z_decay_models: "M:\\marvwy\\20220721_ZE4i2_aligned\\models\\z_decay\\ExpFitLinear(loss='huber', features=['MediumPath', 'EmbryoPath'])"
  z_decay_two_step_label: "embryoRaw"
